meta:
  version: 3
  flow: Classic
  substituting_steps:
    "-OpenROAD.GlobalPlacementSkipIO": Odb.AddPlacementRegions
    OpenROAD.GlobalPlacement: Regions.GlobalPlacement
    OpenROAD.RepairDesignPostGPL: Regions.RepairDesignPostGPL
    OpenROAD.DetailedPlacement: Regions.DetailedPlacement
    "-OpenROAD.CTS": Odb.MacroClockPinFirst
    OpenROAD.CTS: Regions.CTS
    OpenROAD.ResizerTimingPostCTS: Regions.ResizerTimingPostCTS
    OpenROAD.RepairDesignPostGRT: Regions.RepairDesignPostGRT
    OpenROAD.ResizerTimingPostGRT: Regions.ResizerTimingPostGRT
    OpenROAD.RepairAntennas: null
    "-OpenROAD.DetailedRouting": Regions.RepairAntennas
    OpenROAD.DetailedRouting: Regions.DetailedRouting
    "-OpenROAD.RCX": Odb.ShortenNames
    "-Odb.AddPDNObstructions": Odb.RemoveMacroObstructions
    "+OpenROAD.GeneratePDN": Odb.ConnectMacroRingStripes
    "-Odb.RemovePDNObstructions": Odb.RestoreMacroMasters

DESIGN_NAME: efpga_subsystem_top

USE_SLANG: true
SYNTH_AUTONAME: true
SYNTH_STRATEGY: AREA 0
EXTRA_EXCLUDED_CELLS: ["sg13cmos5l_IOPad*"]
VERILOG_DEFINES: [LIBRELANE_HARD_MACROS, IHP_SG13CMOS5L]
ERROR_ON_SYNTH_CHECKS: false
RUN_MAGIC_DRC: False
RUN_KLAYOUT_DRC: True
CLOCK_PORT: clk_i
CLOCK_NET: clk_i
CLOCK_PERIOD: 20.0
PNR_SDC_FILE: dir::efpga_subsystem_top.sdc
SIGNOFF_SDC_FILE: dir::efpga_subsystem_top.sdc

FP_SIZING: absolute
DIE_AREA: [0, 0, 4000, 4250]
PL_TARGET_DENSITY_PCT: 50
PL_MAX_PHI_COEFFICIENT: 1.03
PLACEMENT_REGIONS:
  west_io:
    instances:
      - "efpga_connector_inst.*"
      - "m_axi_*"
      - "s_axil_*"
      - "axi4_*"
      - "fabric_inst.eFPGA_Config_inst.*"
      - "fabric_inst.FrameData*"
      - "fabric_inst.FrameAddressRegister*"
      - "fabric_inst.LongFrameStrobe*"
      - "axil_*"
      - "efpga_com_*"
      - "efpga_config_*"
      - "efpga_fault_irq_o*"
      - "bb_*"
      - "sclk_*"
      - "bitbang_*"
    late_port_margin: 50
    late_instances:
      - "input*"
      - "output*"
      - "efpga_subsystem_top*"
    area: [5.76, 15.12, 213.52, 4233.26]
    utilization: 50
    gpl_max_density: 80
    dpl_padding: 4
    absorb_margin: 25
  npu_east:
    instances:
      - "npu_inst.*"
      - "fabric_inst.NPU_*"
    area: [2872.56, 15.12, 3994.08, 4233.26]
    utilization: 70
ROUTING_OBSTRUCTIONS:
  - [Metal4, 223.92, 190.99, 2872.56, 4040.29]
  - [Metal3, 223.92, 192.49, 2872.56, 206.43]
  - [TopMetal1, 223.92, 190.99, 2872.56, 4040.29]
  - [TopMetal1, 3534.24, 146.97, 3994.24, 4191.28]
FP_OBSTRUCTIONS:
  - [3534.24, 646.97, 3994.24, 653.30]
  - [3534.24, 1153.30, 3994.24, 1159.63]
  - [3534.24, 1659.63, 3994.24, 1665.96]
  - [3534.24, 2165.96, 3994.24, 2172.29]
  - [3534.24, 2672.29, 3994.24, 2678.62]
  - [3534.24, 3178.62, 3994.24, 3184.95]
  - [3534.24, 3684.95, 3994.24, 3691.28]
SLANG_ARGUMENTS: ['--keep-hierarchy']
GPL_CELL_PADDING: 4
DPL_CELL_PADDING: 2
DPL_IMPROVE_PLACEMENT_SEED: 1
# Mirroring is not reproducible after the hold repair (OpenROAD tie-break); off keeps runs deterministic
PL_OPTIMIZE_MIRRORING: false
PL_MAX_DISPLACEMENT_X: 500
PL_MAX_DISPLACEMENT_Y: 2300

VDD_NETS: [VDD]
GND_NETS: [VSS]
PDN_HPITCH: 46.03
PDN_HOFFSET: 10
PDN_EXTEND_TO: boundary
PDN_CFG: dir::pdn_cfg.tcl
REMOVE_MACRO_OBSTRUCTIONS:
  fabric_inst.eFPGA_inst: [TopMetal1]
  psum_requant_container: [TopMetal1]
REMOVE_MACRO_PG_PINS:
  psum_requant_container: [TopMetal1]
IO_PIN_ORDER_CFG: dir::pin_order.cfg
PL_TIMING_DRIVEN: False
GRT_ALLOW_CONGESTION: True
ERROR_ON_DISCONNECTED_PINS: False
MAX_SLEW_VIOLATION_CORNERS: ['*']
MAX_CAP_VIOLATION_CORNERS: ['*']
GRT_OVERFLOW_ITERS: 5
GRT_ANTENNA_REPAIR_MARGIN: 15
DRT_ANTENNA_REPAIR_ITERS: 6
DRT_SAVE_DRC_REPORT_ITERS: 1
DIODE_ON_PORTS: in
DIODE_CELL: sg13cmos5l_antennanp/A

MACRO_RING_STRIPE_CONNECT:
  act_bank_container:
    stripe_layer: Metal4
    pin_layer: Metal2
    max_gap: "1.0"
    max_depth: "9.0"
    nets: "VDD VSS"
PDN_MACRO_CONNECTIONS:
  - "npu_inst\\.act_buffer_stage\\.gen_containers.*\\.container_inst.* VDD VSS VDD VSS"
  - "npu_inst\\.psum_requant_stage\\.gen_containers.*\\.container_inst.* VDD VSS VDD VSS"
  - "fabric_inst\\.eFPGA_inst VDD VSS VPWR VGND"

# Blackbox views = the filelist stubs (with parameters, like the RTL instances); no nl views
MACROS:
  eFPGA:
    gds:
      - dir::../../OWAS_Fabric/Fabric/macro/final_views/gds/eFPGA.gds
