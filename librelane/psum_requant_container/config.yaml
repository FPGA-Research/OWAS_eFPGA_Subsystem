
meta:
  version: 3
  flow: Classic
  substituting_steps:
    Magic.DRC: null

DESIGN_NAME: psum_requant_container

USE_SLANG: True


PNR_SDC_FILE: dir::constraint.sdc
SIGNOFF_SDC_FILE: dir::constraint.sdc
FALLBACK_SDC: dir::constraint.sdc
IO_PIN_ORDER_CFG: dir::pin_order.cfg
# 1 um deep west-edge pins (default 0.4): the macro LEF leaves the pin-connected metal out of pins and OBS, so a
# jog right at a short pin's inner end gave a same-net Metal3 notch (M3.b) with the top-level access wire
IO_PIN_H_LENGTH: 1.0
PDN_CFG: dir::pdn_cfg.tcl

# Timing
CLOCK_PORT: clk_i
CLOCK_NET: clk_i
CLOCK_PERIOD: 20
# NOTE: Use these if the setup timing is violated in the typical corner
PL_RESIZER_SETUP_SLACK_MARGIN: 4
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 80
PL_TIMING_DRIVEN: true
RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true
GRT_RESIZER_SETUP_SLACK_MARGIN: 2
DESIGN_REPAIR_MAX_SLEW_PCT: 40
DESIGN_REPAIR_MAX_CAP_PCT: 40
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 40
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 40
# The PDK default RCX rules are the sg13g2 file (7 layers): TopMetal1 gets its thin Metal5 tables
RCX_RULESETS:
  "nom_*": dir::../rcx/sg13cmos5l.TYP.rules
# Wire RC for the resizer estimates, same as efpga_subsystem_top (the PDK sets none, so the
# estimates used the tech LEF C, about half the RCX wire C). Checked on the psum layout built
# with it: RCX/estimated wire C sum 0.97, median 0.95
LAYERS_RC:
  "*":
    Metal1: {res: 0.00084375, cap: 0.0001273}
    Metal2: {res: 0.000515, cap: 0.0001824}
    Metal3: {res: 0.000515, cap: 0.0001804}
    Metal4: {res: 0.000515, cap: 0.0001800}
    TopMetal1: {res: 0.0000128, cap: 0.0002051}

# Floorplanning

FP_SIZING: absolute
SYNTH_STRATEGY: "AREA 3"

DIE_AREA: [0, 0, 460, 500]
PL_TARGET_DENSITY_PCT: 65
# No cells in the west strip beside bank_A_sram: the ~50 west pins there plus cells placed in the strip
# overflowed its vertical tracks in GRT, the spill went over the SRAM (Metal4 full of its straps) and DRT
# shorted on them. Clean with this blockage at density 60/65/70 (hard and soft)
FP_OBSTRUCTIONS:
  - [0, 352, 30, 500]
GRT_ALLOW_CONGESTION: true

# Allow free displacement (set to number that is definitely bigger than the die
# size for each dimension)
PL_MAX_DISPLACEMENT_Y: 2000

BOTTOM_MARGIN_MULT: 3
TOP_MARGIN_MULT: 3
LEFT_MARGIN_MULT: 20
RIGHT_MARGIN_MULT: 20
# PDN Setup

VDD_NETS:
- VDD
GND_NETS:
- VSS
# TopMetal1 stripes on the top-level PG grid (pitch 46.03), no core ring
PDN_CORE_RING: False
PDN_EXTEND_TO: boundary
PDN_HPITCH: 46.03
PDN_HOFFSET: 4.90
PDN_HWIDTH: 2
PDN_HSPACING: 4
# Keep signal TopMetal1 off the stripes so the top-level PDN can run over the macro
ROUTING_OBSTRUCTIONS:
  - [TopMetal1, 0, 11.84, 460, 26.64]
  - [TopMetal1, 0, 57.87, 460, 72.67]
  - [TopMetal1, 0, 103.9, 460, 118.7]
  - [TopMetal1, 0, 149.93, 460, 164.73]
  - [TopMetal1, 0, 195.96, 460, 210.76]
  - [TopMetal1, 0, 241.99, 460, 256.79]
  - [TopMetal1, 0, 288.02, 460, 302.82]
  - [TopMetal1, 0, 334.05, 460, 348.85]
  - [TopMetal1, 0, 380.08, 460, 394.88]
  - [TopMetal1, 0, 426.11, 460, 440.91]
  - [TopMetal1, 0, 472.14, 460, 486.94]
  # The top-level Metal4 PDN stripes (VDD x 31.02+50n, VSS 34.02+50n, 1 um wide) run over the whole macro
  # height; the macro's own Metal4 stripes span only y 15.93 (VDD) / 21.93 (VSS) to 476.85 / 482.85. Keep
  # signal Metal4 out from under the top stripes in the bottom and top margins (no signal pins there)
  - [Metal4, 30.5, 0, 35.5, 22.50]
  - [Metal4, 30.5, 476.30, 35.5, 500]
  - [Metal4, 80.5, 0, 85.5, 22.50]
  - [Metal4, 80.5, 476.30, 85.5, 500]
  - [Metal4, 130.5, 0, 135.5, 22.50]
  - [Metal4, 130.5, 476.30, 135.5, 500]
  - [Metal4, 180.5, 0, 185.5, 22.50]
  - [Metal4, 180.5, 476.30, 185.5, 500]
  - [Metal4, 230.5, 0, 235.5, 22.50]
  - [Metal4, 230.5, 476.30, 235.5, 500]
  - [Metal4, 280.5, 0, 285.5, 22.50]
  - [Metal4, 280.5, 476.30, 285.5, 500]
  - [Metal4, 330.5, 0, 335.5, 22.50]
  - [Metal4, 330.5, 476.30, 335.5, 500]
  - [Metal4, 380.5, 0, 385.5, 22.50]
  - [Metal4, 380.5, 476.30, 385.5, 500]
  - [Metal4, 430.5, 0, 435.5, 22.50]
  - [Metal4, 430.5, 476.30, 435.5, 500]
PDN_HORIZONTAL_HALO: 2
PDN_VERTICAL_HALO: 2
PDN_MACRO_CONNECTIONS:
  - "bank_A_sram.gen_ihp_256x32.u_sram_256x32 VDD VSS VDD! VSS!"
  - "bank_A_sram.gen_ihp_256x32.u_sram_256x32 VDD VSS VDDARRAY! VSS!"
  - "bank_B_sram.gen_ihp_256x32.u_sram_256x32 VDD VSS VDD! VSS!"
  - "bank_B_sram.gen_ihp_256x32.u_sram_256x32 VDD VSS VDDARRAY! VSS!"

MACROS:
  RM_IHPSG13_1P_256x32_c2_bm_bist:
    gds:
      - pdk_dir::libs.ref/sg13cmos5l_sram/gds/RM_IHPSG13_1P_256x32_c2_bm_bist.gds
    lef:
      - pdk_dir::libs.ref/sg13cmos5l_sram/lef/RM_IHPSG13_1P_256x32_c2_bm_bist.lef
    lib:
      "*_typ_1p20V_25C":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_256x32_c2_bm_bist_typ_1p20V_25C.lib
      "nom_fast_1p32V_m40C":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_256x32_c2_bm_bist_fast_1p32V_m55C.lib
      "nom_slow_1p08V_125C":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_256x32_c2_bm_bist_slow_1p08V_125C.lib
    instances:
      bank_A_sram.gen_ihp_256x32.u_sram_256x32:
        location: [30, 360]
        orientation: FN
      bank_B_sram.gen_ihp_256x32.u_sram_256x32:
        location: [30, 20]
        orientation: FS
