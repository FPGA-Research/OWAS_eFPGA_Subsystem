meta:
  version: 3
  flow: Classic
  substituting_steps:
    Magic.DRC: null
    OpenROAD.CTS: null

DESIGN_NAME: act_bank_container

USE_SLANG: True
# NOTE: Seems to only report false positives, flow runs also with the unmapped
# cells
ERROR_ON_SYNTH_CHECKS: False


PNR_SDC_FILE: dir::constraint.sdc
SIGNOFF_SDC_FILE: dir::constraint.sdc
FALLBACK_SDC: dir::constraint.sdc
IO_PIN_ORDER_CFG: dir::pin_order.cfg
# Fixed pin positions (abutment with the eFPGA), frozen from a run with pin_order.cfg; applied
# after it, so it overrides pin_order.cfg
FP_DEF_TEMPLATE: dir::pin_template.def
PDN_EXTEND_TO: core_ring
PDN_CFG: dir::pdn_cfg.tcl
# Timing
CLOCK_PORT: clk_i
CLOCK_NET: clk_i
CLOCK_PERIOD: 20.0
# NOTE: Use these if the setup timing is violated in the typical corner
PL_RESIZER_SETUP_SLACK_MARGIN: 2.5
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 80
PL_RESIZER_HOLD_MAX_BUFFER_PCT: 100
GRT_RESIZER_HOLD_MAX_BUFFER_PCT: 100
# Keep the hold delay chains (MACROS/Cells/act_hold_delay.sv)
RSZ_DONT_TOUCH_RX: "^u_hold_dly_"

ERROR_ON_DISCONNECTED_PINS: False
# Floorplanning

FP_SIZING: absolute
SYNTH_STRATEGY: "AREA 2"

DIE_AREA: [0, 0, 275, 168.90]
PL_TARGET_DENSITY_PCT: 60
GRT_ALLOW_CONGESTION: true

# Allow free displacement (set to number that is definitely bigger than the die
# size for each dimension)
PL_MAX_DISPLACEMENT_Y: 2000

IO_PIN_V_LAYER: Metal3
IO_PIN_H_LAYER: Metal2
PDN_CORE_RING: True
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_RING_HSPACING: 1
PDN_CORE_RING_VSPACING: 1
PDN_CORE_RING_VWIDTH: 3
PDN_CORE_RING_HWIDTH: 3
PDN_CORE_RING_VOFFSET: 1
PDN_CORE_RING_HOFFSET: 3
PDN_VOFFSET: 3.04
PDN_HOFFSET: 0.22
PDN_VPITCH: 30
PDN_HPITCH: 30
# PDN Setup
BOTTOM_MARGIN_MULT: 3
TOP_MARGIN_MULT: 3
RIGHT_MARGIN_MULT: 18
LEFT_MARGIN_MULT: 18

RT_MAX_LAYER: Metal4
PDN_OBSTRUCTIONS:
  - [Metal4, 0, 156.20, 275, 165.60]
ROUTING_OBSTRUCTIONS:
  - [Metal4, 0, 157.40, 275, 165.60]
  - [Metal3, 0, 0, 8.14, 168.90]
  - [Metal4, 0, 0, 8.14, 168.90]
  - [Metal3, 266.42, 0, 275, 168.90]
  - [Metal4, 266.42, 0, 275, 168.90]
  - [Metal4, 17.5, 43.90, 254.3, 154.28]
  - [Metal2, 17.5, 44.90, 254.3, 154.28]

FP_OBSTRUCTIONS:
  - [8.64, 42.90, 17.5, 154.98]
  - [254.3, 42.90, 265.92, 154.98]
GRT_ADJUSTMENT: 0.15
VDD_NETS:
- VDD
GND_NETS:
- VSS
FP_MACRO_HORIZONTAL_HALO: 1
FP_MACRO_VERTICAL_HALO: 1
PDN_VERTICAL_HALO: 1
PDN_HORIZONTAL_HALO: 2
PDN_CORE_RING_ALLOW_OUT_OF_DIE: False
PDN_MACRO_CONNECTIONS:
  - "act_sram_inst.gen_ihp_512x8.u_sram_512x8 VDD VSS VDD! VSS!"
  - "act_sram_inst.gen_ihp_512x8.u_sram_512x8 VDD VSS VDDARRAY! VSS!"
  

MACROS:
  RM_IHPSG13_1P_512x8_c3_bm_bist:
    gds:
      - pdk_dir::libs.ref/sg13cmos5l_sram/gds/RM_IHPSG13_1P_512x8_c3_bm_bist.gds
    lef:
      - pdk_dir::libs.ref/sg13cmos5l_sram/lef/RM_IHPSG13_1P_512x8_c3_bm_bist.lef
    # No nl view: the PDK model does not parse in Yosys, the blackbox comes with VERILOG_FILES
    lib:
      "*_typ_1p20V_25C":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_512x8_c3_bm_bist_typ_1p20V_25C.lib
      "nom_fast_1p32V_m40C":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_512x8_c3_bm_bist_fast_1p32V_m55C.lib
      "nom_slow_1p08V_125C":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_512x8_c3_bm_bist_slow_1p08V_125C.lib
    instances:
      act_sram_inst.gen_ihp_512x8.u_sram_512x8:
        location: [17.5, 43.90]
        orientation: N
